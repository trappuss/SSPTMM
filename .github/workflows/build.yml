# Builds and tests SSPTMM on GitHub's own Windows machines.
#
# - Every push and pull request: build and run the tests.
# - Every version tag (v1.2.3): also publish SSPTMM.exe exactly as SSPTMM-release-to-github.bat
#   does, zip it the same way (one SSPTMM\ folder), and keep the zip as this run's artifact with
#   its SHA-256 in the run summary. That build comes from the tagged source in this repository and
#   its log is public, so anyone can see what the release was made from.
#
# It does not create or change GitHub releases: SSPTMM-release-to-github.bat still does that.

name: Build

on:
  push:
    branches: [main, steam-workshop-ui]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build src/TCFModManager.App -c Release --nologo

      - name: Test
        run: dotnet test Tests/TCFModManager.Core.Tests -c Release --nologo

      - name: Publish and zip (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $props = [IO.File]::ReadAllText('build/Directory.Build.props')
          $declared = [regex]::Match($props, '<Version>([^<]+)</Version>').Groups[1].Value
          if ($declared -ne $version) { throw "Tag v$version but build/Directory.Build.props says $declared" }

          $pkg = "SSPTMM-$version-win-x64"
          $app = Join-Path 'release' (Join-Path $pkg 'SSPTMM')
          dotnet publish src/TCFModManager.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $app --nologo
          if (-not (Test-Path (Join-Path $app 'SSPTMM.exe'))) { throw 'SSPTMM.exe was not published' }
          Remove-Item (Join-Path $app '*.pdb') -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md (Join-Path $app 'CHANGELOG.md')

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path 'release' "$pkg.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path 'release' $pkg), $zip)

          $exeHash = (Get-FileHash (Join-Path $app 'SSPTMM.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "PKG=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "## SSPTMM $version",
            '',
            "Built from commit ${{ github.sha }}.",
            '',
            '| File | SHA-256 |',
            '|---|---|',
            "| $pkg.zip | ``$zipHash`` |",
            "| SSPTMM.exe | ``$exeHash`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Keep the zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: release/${{ env.PKG }}.zip
          if-no-files-found: error
